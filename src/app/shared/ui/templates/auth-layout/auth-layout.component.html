<section class="card border-0 shadow-sm bg-body-tertiary mx-auto w-100 auth-card" [class.auth-card-wide]="wide()">
  <div class="card-body d-grid gap-4 p-4 p-lg-5">
    <div class="d-grid gap-3">
      <span class="header-text">{{ headerText() }}</span>
      <h2>{{ title() }}</h2>
    </div>

    <ng-content />

    @if (footerLink()) {
      <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between gap-2 text-body-secondary">
        <span>{{ footerText() }}</span>
        <a [routerLink]="footerLink()" class="fw-bold">{{ footerLinkLabel() }}</a>
      </div>
    }
  </div>
</section>
