<app-auth-layout
        [headerText]="'auth.login.headerText' | translate"
        [title]="'auth.login.title' | translate"
        [footerText]="'auth.login.footerText' | translate"
        [footerLinkLabel]="'auth.login.footerLink' | translate"
        footerLink="/auth/sign-up">
    <form class="d-grid gap-3" [formGroup]="form" (ngSubmit)="submit()">
        <app-form-field
                for="email"
                [label]="'auth.field.email' | translate"
                [error]="'auth.validation.email' | translate">
            <app-text-input
                    inputId="email"
                    type="email"
                    autocomplete="email"
                    formControlName="email"
                    [placeholder]="'auth.placeholder.email' | translate"/>
        </app-form-field>

        <app-form-field
                for="password"
                [label]="'auth.field.password' | translate"
                [error]="'auth.validation.passwordMinLength' | translate">
            <a fieldAction routerLink="/auth/forgot-password" class="small">{{ 'auth.login.forgotPassword' | translate }}</a>
            <app-text-input
                    inputId="password"
                    type="password"
                    autocomplete="current-password"
                    formControlName="password"
                    [placeholder]="'auth.placeholder.password' | translate"/>
        </app-form-field>

        @if (errorMessage()) {
            <app-alert variant="danger">{{ errorMessage() }}</app-alert>
        }

        <button
                appButton
                type="submit"
                block
                [loading]="isSubmitting()"
                [loadingText]="'auth.login.submitting' | translate">
            {{ 'auth.login.submit' | translate }}
        </button>
    </form>
</app-auth-layout>
