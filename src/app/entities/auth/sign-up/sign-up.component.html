<app-auth-layout
        wide
        [headerText]="'auth.signUp.headerText' | translate"
        [title]="'auth.signUp.title' | translate"
        [footerText]="'auth.signUp.footerText' | translate"
        [footerLinkLabel]="'auth.signUp.footerLink' | translate"
        footerLink="/auth/login">
    <form class="d-grid gap-3" [formGroup]="form" (ngSubmit)="submit()">
        <app-form-field
                for="name"
                [label]="'auth.field.name' | translate"
                [error]="'auth.validation.name' | translate">
            <app-text-input
                    inputId="name"
                    autocomplete="name"
                    formControlName="name"
                    [placeholder]="'auth.placeholder.name' | translate"/>
        </app-form-field>

        <app-form-field
                for="email"
                [label]="'auth.field.email' | translate"
                [error]="'auth.validation.email' | translate">
            <app-text-input
                    inputId="email"
                    type="email"
                    autocomplete="email"
                    formControlName="email"
                    [placeholder]="'auth.placeholder.email' | translate"/>
        </app-form-field>

        <div class="row g-3">
            <app-form-field
                    class="col-12 col-md-6"
                    for="password"
                    [label]="'auth.field.password' | translate"
                    [error]="'auth.validation.passwordMinLength' | translate">
                <app-text-input
                        inputId="password"
                        type="password"
                        autocomplete="new-password"
                        formControlName="password"
                        [placeholder]="'auth.placeholder.passwordMinLength' | translate"/>
            </app-form-field>

            <app-form-field
                    class="col-12 col-md-6"
                    for="confirmPassword"
                    [label]="'auth.field.confirmPassword' | translate"
                    [error]="'auth.validation.confirmPassword' | translate">
                <app-text-input
                        inputId="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        formControlName="confirmPassword"
                        [placeholder]="'auth.placeholder.confirmPassword' | translate"/>
            </app-form-field>
        </div>

        @if ((form.controls.password.touched || form.controls.confirmPassword.touched) && form.hasError('passwordMismatch')) {
            <div class="invalid-feedback d-block">{{ 'auth.validation.passwordMismatch' | translate }}</div>
        }

        @if (errorMessage()) {
            <app-alert variant="danger">{{ errorMessage() }}</app-alert>
        }

        <button
                appButton
                type="submit"
                block
                [loading]="isSubmitting()"
                [loadingText]="'auth.signUp.submitting' | translate">
            {{ 'auth.signUp.submit' | translate }}
        </button>
    </form>
</app-auth-layout>
