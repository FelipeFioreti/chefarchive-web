<app-auth-layout
        [headerText]="'auth.forgotPassword.headerText' | translate"
        [title]="'auth.forgotPassword.title' | translate"
        [footerText]="'auth.forgotPassword.footerText' | translate"
        [footerLinkLabel]="'auth.forgotPassword.footerLink' | translate"
        footerLink="/auth/login">
    @if (sentTo()) {
        <app-alert variant="success">
            {{ 'auth.forgotPassword.sentPrefix' | translate }} <strong>{{ sentTo() }}</strong>{{ 'auth.forgotPassword.sentSuffix' | translate }}
        </app-alert>
    } @else {
        <p class="text-body-secondary mb-0">{{ 'auth.forgotPassword.description' | translate }}</p>

        <form class="d-grid gap-3" [formGroup]="form" (ngSubmit)="submit()">
            <app-form-field
                    [required]="false"
                    [label]="'auth.field.email' | translate"
                    [error]="'auth.validation.email' | translate">
                <app-text-input
                        type="email"
                        autocomplete="email"
                        formControlName="email"
                        [placeholder]="'auth.placeholder.email' | translate"/>
            </app-form-field>

            @if (errorMessage()) {
                <app-alert variant="danger">{{ errorMessage() }}</app-alert>
            }

            <button
                    appButton
                    type="submit"
                    block
                    [loading]="isSubmitting()"
                    [loadingText]="'auth.forgotPassword.submitting' | translate">
                {{ 'auth.forgotPassword.submit' | translate }}
            </button>
        </form>
    }
</app-auth-layout>
